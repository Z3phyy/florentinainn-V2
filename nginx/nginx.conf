worker_processes auto;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/snippets/http-common.conf;

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    server {
        listen 80;
        server_name www.florentinainn.site;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 $forwarded_proto://florentinainn.site$request_uri; }
    }

    server {
        listen 80 default_server;
        server_name florentinainn.site localhost _;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }

        include /etc/nginx/snippets/app-locations.conf;
    }
}