log_format florentina_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time';

map $http_upgrade $florentina_connection_upgrade {
    default upgrade;
    ''      '';
}

upstream florentina_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream florentina_backend {
    server 127.0.0.1:5001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name florentinainn.site;

    server_tokens off;
    access_log /var/log/nginx/florentina-inn.access.log florentina_noquery;
    error_log /var/log/nginx/florentina-inn.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $florentina_connection_upgrade;

    location = /backend {
        return 301 /backend/;
    }

    location /backend/ {
        proxy_pass http://florentina_backend/;
        client_max_body_size 520m;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass http://florentina_frontend;
        client_max_body_size 20m;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}
