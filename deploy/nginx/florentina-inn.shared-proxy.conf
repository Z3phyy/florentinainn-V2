log_format florentina_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time $host';

map $http_upgrade $florentina_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name florentinainn.site;
    server_tokens off;
    access_log /var/log/nginx/access.log florentina_noquery;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://florentinainn.site$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name florentinainn.site;
    server_tokens off;
    access_log /var/log/nginx/access.log florentina_noquery;

    ssl_certificate /etc/letsencrypt/live/florentinainn.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/florentinainn.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $florentina_frontend florentina-frontend:3000;
    set $florentina_backend florentina-backend:5001;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $florentina_connection_upgrade;

    location = /backend {
        return 301 /backend/;
    }

    location /backend/ {
        rewrite ^/backend/(.*)$ /$1 break;
        proxy_pass http://$florentina_backend;
        client_max_body_size 520m;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass http://$florentina_frontend;
        client_max_body_size 20m;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
